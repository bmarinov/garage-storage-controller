name: Build and release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      DEV_IMAGE_NAME: ${{ github.repository }}-dev
      DOCKERHUB_IMAGE: docker.io/getclustered/garage-storage-controller
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    permissions:
      contents: write
      packages: write
      checks: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check E2E test status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          completed_at=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=test-e2e" \
            --jq '[.check_runs[] | select(.conclusion == "success")][0].completed_at // empty')
          if [ -z "$completed_at" ]; then
            echo "::error::No successful test-e2e check run for ${{ github.sha }}"
            exit 1
          fi
          echo "E2E test: success at $completed_at"

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always --dirty)
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote CI image
        id: promote
        env:
          CI_IMAGE: ${{ env.REGISTRY }}/${{ env.DEV_IMAGE_NAME }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ! digest=$(docker buildx imagetools inspect "${CI_IMAGE}:sha-${COMMIT_SHA}" --format '{{json .Manifest}}' | jq -re .digest); then
            echo "::error::No CI image at ${CI_IMAGE}:sha-${COMMIT_SHA}. Tag a commit with a green build run on main."
            exit 1
          fi
          docker buildx imagetools create -t "${RELEASE_IMAGE}:${VERSION}" "${CI_IMAGE}@${digest}"
          echo "Promoted ${CI_IMAGE}@${digest} -> ${RELEASE_IMAGE}:${VERSION}"
          echo "DIGEST=${digest}" >> "$GITHUB_OUTPUT"

      - name: Tag latest
        if: github.ref_type == 'tag'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub mirror
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

      - name: Push latest to Docker Hub
        if: github.ref_type == 'tag' && env.DOCKERHUB_USERNAME != ''
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}

      - name: Package CRDs
        if: github.ref_type == 'tag'
        run: kubectl kustomize ./config/install/crds -o crds-${{ steps.version.outputs.VERSION }}.yaml

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          draft: true
          generate_release_notes: true
          files: |
            crds-${{ steps.version.outputs.VERSION }}.yaml
          body: |

            Controller image:
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}`
            - `${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.VERSION }}` (mirror)
            - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}@${{ steps.promote.outputs.DIGEST }}` (digest-pinned)

            ## Changes

            <!-- Changes since last release -->

            <!--
            ## Upgrading from a previous version
            No breaking changes.

            > Apply the new CRDs bundle to existing installations **before** upgrading.

            ```sh
            kubectl apply -f \
            https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/crds-${{ steps.version.outputs.VERSION }}.yaml
            ```

            Upgrade the chart to the new version:
            ```sh
            helm upgrade garage-storage-controller \
              oci://ghcr.io/bmarinov/charts/garage-storage-controller \
              --version <chart-version> \
              --reuse-values \
              -n garage-controller-system # replace with your namespace
            ```
            -->

